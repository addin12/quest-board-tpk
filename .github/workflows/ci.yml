name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Security audit (high and critical, runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build (demo data)
        run: npm run build
      - name: Build (empty data, the state of a new Sheet)
        run: npm run build
        env:
          TPK_DATA_FILE: data/empty.json
      - name: The empty site has its placeholder pages, and the sitemap does not list them
        run: |
          test -f out/en/games/none/index.html
          test -f out/id/gm/none/index.html
          ! grep -q '/none/' out/sitemap.xml

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
