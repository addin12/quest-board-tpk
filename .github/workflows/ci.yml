name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the repository; nothing here needs to write to it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Security audit (high and critical, runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build (demo data)
        run: npm run build
      - name: Build (empty data, the state of a new Sheet)
        run: npm run build
        env:
          TPK_DATA_FILE: data/empty.json
      - name: The empty site has its placeholder pages, and the sitemap does not list them
        run: |
          test -f out/en/games/none/index.html
          test -f out/id/gm/none/index.html
          ! grep -q '/none/' out/sitemap.xml

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # This step has hung for 20+ minutes twice (apt or a download stalling). A time limit and one more try turn that into a delay.
      - name: Install browsers
        id: browsers
        timeout-minutes: 6
        continue-on-error: true
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install browsers (second try)
        if: steps.browsers.outcome != 'success'
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
